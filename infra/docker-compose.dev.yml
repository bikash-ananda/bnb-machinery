# Local development services: docker compose -f infra/docker-compose.dev.yml up -d
name: bnb-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: bnb, POSTGRES_USER: bnb, POSTGRES_PASSWORD: devpassword }
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes: { pgdata_dev: {} }
