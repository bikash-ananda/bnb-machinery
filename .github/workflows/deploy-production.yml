name: Deploy Machinery Tools to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machinery-tools-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over pinned SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing repository secret VPS_HOST}"
          : "${VPS_USER:?Missing repository secret VPS_USER}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing repository secret VPS_SSH_PRIVATE_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing repository secret VPS_KNOWN_HOSTS}"

          if [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "ERROR: VPS_HOST contains characters other than letters, digits, dots, or hyphens."
            exit 2
          fi
          if [[ ! "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]; then
            echo "ERROR: VPS_USER is not a valid SSH username."
            exit 2
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "${VPS_USER}@${VPS_HOST}" 'cd /opt/bnb-machinery && git fetch --prune origin main && git checkout -B main origin/main && git reset --hard origin/main && bash infra/scripts/deploy-production.sh'
